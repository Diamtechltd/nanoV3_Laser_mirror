aperture_iris:
  min_mm: 1.5                     # in mm
  max_mm: 17                      # in mm

motion:
  axis_count: 2
  endstop_enabled: true
  minimum_position: 0             # in mm
  maximum_position: 22.23         # in mm
  maximum_speed: 50               # in mm/s
  default_current_ma: 140         # 140 mA is a good default for the this stepper motor.
  default_microsteps: 4
  default_move_steps: 1000        # for 1 microstep
  auto_disable_after_move: true

homing:
  retract_steps: 0
  direction_negative: true
  double_tap_distance_mm: 2
  second_seek_delay_multiplier: 2

tmc2209:
  uart_enabled: true
  uart_baud: 57600

arduino:
  name: "Aperture Driver #1"
  debug_mode: false
  save_config_to_eeprom: true

stepper_motor:
  steps_per_mm: 193.333
  gear_ratio: 1000.0             # output:input ratio (1.0 = direct drive)
  full_stroke_mm: 30
  full_stroke_steps_1x: 5800
  microsteps_delay: # safe minimum delay in microseconds for each microstep, to avoid losing steps at high speeds
    1: 275
    2: 140
    4: 70
    8: 25
    16: 12
    32: 6
    64: 5
    128: 5
    256: 5
